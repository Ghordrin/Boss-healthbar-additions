name: Changelog post

# Run by hand once a version is live on the Plugin Hub, since the version bump lands on main before that.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to post (defaults to the current version)
        required: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          current=$(sed -n 's/^version=//p' runelite-plugin.properties | tr -d '\r')
          echo "version=${INPUT_VERSION:-$current}" >> "$GITHUB_OUTPUT"

      - name: Send to Discord
        if: steps.version.outputs.version != ''
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK_URL }}
          VERSION: ${{ steps.version.outputs.version }}
          URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_CHANGELOG_WEBHOOK_URL is not set"
            exit 1
          fi
          # The lines under "## <version>" up to the next "## " heading.
          notes=$(tr -d '\r' < CHANGELOG.md | awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }' | sed '/^$/d')
          if [ -z "$notes" ]; then
            echo "No CHANGELOG section for $VERSION"
            exit 1
          fi
          # One embed per "### " group. A single embed description holds 4096 characters and a release is
          # longer than that, while Discord takes up to 10 embeds and 6000 characters over all of them.
          work=$(mktemp -d)
          printf '%s\n' "$notes" | awk -v dir="$work" '
            /^### / { n++; print substr($0, 5) > (dir "/name_" n); next }
            { print > (dir "/body_" (n + 0)) }'
          count=$(find "$work" -name 'name_*' | wc -l)
          if [ "$count" -eq 0 ]; then
            # A release with no "### " groups goes out as one embed.
            printf 'Changes\n' > "$work/name_1"
            mv "$work/body_0" "$work/body_1"
            count=1
          elif [ -s "$work/body_0" ]; then
            # Anything written above the first group belongs with it.
            cat "$work/body_0" "$work/body_1" > "$work/body_1.new"
            mv "$work/body_1.new" "$work/body_1"
          fi
          : > "$work/embeds.jsonl"
          i=1
          while [ "$i" -le "$count" ]; do
            name=$(cat "$work/name_$i")
            body=$(cat "$work/body_$i" 2>/dev/null)
            if [ ${#body} -gt 4000 ]; then
              body="${body:0:4000}"$'\n'"…"
            fi
            if [ "$i" -eq 1 ]; then
              jq -n --arg t "Boss Health Bar Additions $VERSION — $name" --arg d "$body" --arg u "$URL" \
                '{title: $t, url: $u, description: $d, color: 13938487}' >> "$work/embeds.jsonl"
            else
              jq -n --arg t "$name" --arg d "$body" \
                '{title: $t, description: $d, color: 13938487}' >> "$work/embeds.jsonl"
            fi
            i=$((i + 1))
          done
          # Over ten groups would be refused outright, so say so rather than sending it.
          if [ "$count" -gt 10 ]; then
            echo "$count sections is more than the ten embeds Discord accepts"
            exit 1
          fi
          jq -s '{embeds: ., allowed_mentions: {parse: []}}' "$work/embeds.jsonl" \
            | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
